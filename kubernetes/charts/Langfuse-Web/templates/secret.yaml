{{- if .Values.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: langfuse-web-secrets
  labels:
    app: "{{ .Values.release_name }}"
    component: langfuse-web
type: Opaque
stringData:
  DATABASE_URL: "<SET_ME>"
  NEXTAUTH_SECRET: "<SET_ME>"
  ENCRYPTION_KEY: "<SET_ME>"
  SALT: "<SET_ME>"
  CLICKHOUSE_MIGRATION_URL: "<SET_ME>"
  CLICKHOUSE_USER: "<SET_ME>"
  CLICKHOUSE_PASSWORD: "<SET_ME>"
  LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID: "<SET_ME>"
  LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY: "<SET_ME>"
  LANGFUSE_S3_MEDIA_UPLOAD_ACCESS_KEY_ID: "<SET_ME>"
  LANGFUSE_S3_MEDIA_UPLOAD_SECRET_ACCESS_KEY: "<SET_ME>"
  LANGFUSE_S3_BATCH_EXPORT_ACCESS_KEY_ID: "<SET_ME>"
  LANGFUSE_S3_BATCH_EXPORT_SECRET_ACCESS_KEY: "<SET_ME>"
  REDIS_AUTH: "<SET_ME>"
  # Single source for the public key: both Langfuse-Web and the Vault-Init Job
  # read it from this Secret via envFrom. Ships empty on purpose - an empty
  # value disables Langfuse headless init and makes vault-init skip its write,
  # so a missed override logs a line instead of permanently binding the project
  # to a placeholder key that no later value can replace.
  LANGFUSE_INIT_PROJECT_PUBLIC_KEY: ""
  LANGFUSE_INIT_PROJECT_SECRET_KEY: ""
  LANGFUSE_INIT_USER_PASSWORD: ""
{{- end }}
